nerHTML=`<h2 dir="ltr">${esc(group)} → ${esc(c.title)}</h2><div class="muted">${qs.length}/${c.expected} extracted MCQs · ${done} answered</div>${c.expected!==qs.length?'<p class="warning">تنبيه: بعض الأسئلة لم تُستخرج بشكل موثوق من النص؛ العدد الأصلي ظاهر بجانب عدد المستخرج.</p>':''}<div class="modes">${['Study','Test','Most Common','Wrong Answers'].map(m=>`<button class="${mode===m?'active':''}" onclick="setMode('${m}')" ${m==='Wrong Answers'&&!submitted?'disabled':''}>${m}</button>`).join('')}</div><div class="panel">${mode==='Study'?qs.map(q=>card(q,'Study')).join(''):mode==='Most Common'?common(qs):mode==='Test'?`${!submitted?`<div class="muted">Answered ${done}/${qs.length} · Submit once after completing all questions</div>`:''}${qs.map(q=>card(q,'Test')).join('')}<button class="active" ${done!==qs.length||submitted?'disabled':''} onclick="submit()">Submit final answers</button>`:`<div class="score">Score: ${qs.filter(q=>eq(answers[q.n]||[],q.key)).length} / ${qs.length}</div>${qs.filter(q=>!eq(answers[q.n]||[],q.key)).map(q=>card(q,'Wrong Answers')).join('')||'<p>✓ All answers correct!</p>'}`}</div>`}render();</script></body></html>
